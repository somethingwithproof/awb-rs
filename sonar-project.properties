sonar.projectKey=somethingwithproof_awb-rs
sonar.organization=somethingwithproof

# sonar.sources rejects globs, so index from the root and narrow with inclusions.
sonar.sources=.
sonar.inclusions=crates/*/src/**,ui/linux/awb_gtk/src/**,gen_swift_bindings/src/**
sonar.tests=.
sonar.test.inclusions=crates/*/tests/**,tests/**

sonar.rust.clippyReport.reportPaths=clippy.json
sonar.rust.lcov.reportPaths=lcov.info
